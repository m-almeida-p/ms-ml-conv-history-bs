basePath: /
definitions:
  api.healthResponse:
    properties:
      status:
        enum:
        - ok
        - unavailable
        example: ok
        type: string
    type: object
  handler.conversationRef:
    properties:
      _id:
        description: ID is the conversation id (the A2A contextId).
        example: conv_v1_8ab59029-bc3c-4e77-b49f-9fb053d90c52
        type: string
    type: object
  handler.conversationResponse:
    properties:
      _id:
        example: conv_v1_8ab59029-bc3c-4e77-b49f-9fb053d90c52
        type: string
      cursor:
        description: |-
          Cursor is the position of this conversation in the list when it was read. It is opaque: pass it
          as page[before] for the conversations older than this position or as page[after] for the more
          recent ones. It stays right even if the conversation receives a message later.
        example: 1792771602218000~conv_v1_8ab59029-bc3c-4e77-b49f-9fb053d90c52
        type: string
      firstMessage:
        description: |-
          FirstMessage is the first message the user wrote in the conversation, cut at 200 characters, so that a list can say what each
          conversation was about. It is absent when the conversation has no message from the user. It is text, never markup.
        example: quiero yapear
        type: string
      firstMessageTruncated:
        description: 'FirstMessageTruncated is true when FirstMessage is not the whole
          message: it was cut at 200 characters or at the agent''s limit.'
        example: false
        type: boolean
      firstReceived:
        description: FirstReceived and LastReceived are the times of the first and
          last message, in Unix seconds with milliseconds.
        example: 1.7925052435e+09
        type: number
      lastReceived:
        example: 1.7925055435e+09
        type: number
      messageCount:
        example: 5
        type: integer
    type: object
  handler.conversationsResponse:
    properties:
      conversations:
        items:
          $ref: '#/definitions/handler.conversationResponse'
        type: array
    type: object
  handler.messageMetadata:
    properties:
      eventName:
        description: EventName is the event that produced the message.
        enum:
        - UserMessageSent
        - AgentMessageSent
        - GuardrailResponseSent
        example: UserMessageSent
        type: string
      flow:
        description: Flow is the flow the message took place in, such as p2p. It is
          absent outside any flow. A message the user writes carries the flow they
          were in when they wrote it, so the message that opens a flow has none and
          the one that leaves it carries the flow it was in.
        example: p2p
        type: string
      sequence:
        description: Sequence is the position of the message's event in the conversation.
          Gaps are normal.
        example: 2
        type: integer
      truncated:
        description: Truncated is true when the recorded text was cut at the agent's
          limit.
        example: false
        type: boolean
    type: object
  handler.messageResponse:
    properties:
      _id:
        description: 'ID is the message id and the paging cursor: the sequence of
          its event in the conversation, as a string. It is unique within the conversation.'
        example: "1042"
        type: string
      authorId:
        description: AuthorID is the customer account for appUser and ms-ml-genai-agent-bs
          for appMaker.
        example: c59f8a80-6e65-4d1b-9c0e-0a1b2c3d4e5f
        type: string
      metadata:
        $ref: '#/definitions/handler.messageMetadata'
      received:
        description: Received is when it happened, in Unix seconds with milliseconds
          as decimals.
        example: 1.792505243792e+09
        type: number
      role:
        description: 'Role is who wrote it: appUser for the customer, appMaker for
          the assistant and its guardrail replies.'
        enum:
        - appUser
        - appMaker
        example: appUser
        type: string
      source:
        $ref: '#/definitions/handler.sourceResponse'
      text:
        example: quiero yapear
        type: string
      type:
        description: Type is the message type. Always text for now.
        example: text
        type: string
    type: object
  handler.messagesResponse:
    properties:
      conversation:
        $ref: '#/definitions/handler.conversationRef'
      messages:
        items:
          $ref: '#/definitions/handler.messageResponse'
        type: array
    type: object
  handler.problemResponse:
    properties:
      detail:
        description: Detail explains this occurrence without repeating what the client
          sent. Do not parse it.
        example: page[before] or page[after] is not the _id of a message in this conversation.
        type: string
      status:
        description: Status repeats the HTTP status code of the response.
        example: 400
        type: integer
      title:
        description: Title is a short summary of the type; for about:blank it is the
          HTTP status phrase.
        example: Invalid cursor
        type: string
      type:
        description: |-
          Type identifies the kind of problem. One of the service's tag URIs (invalid-request,
          invalid-cursor, conversation-not-found, under tag:yape.com.pe,2026:conversation-history:), or
          about:blank when the problem means nothing beyond its HTTP status.
        example: tag:yape.com.pe,2026:conversation-history:invalid-cursor
        type: string
    type: object
  handler.sourceResponse:
    properties:
      type:
        example: api
        type: string
    type: object
host: localhost:3100
info:
  contact: {}
  description: 'Conversation history of the Yape assistant: the chat between the user
    and the agent, shaped after the Smooch message. PoC: there is no authentication,
    so it must not be deployed.'
  title: ms-ml-conv-history-bs API
  version: "1.0"
paths:
  /health:
    get:
      description: Returns 200 when the database answers and 503 when it does not.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.healthResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/api.healthResponse'
      summary: Health check
      tags:
      - Health
  /v1/conversations:
    get:
      description: 'Returns up to 100 conversations of the account that have chat
        messages, the most recent first, with their message count and the times of
        their first and last message. Without a cursor it returns the most recent
        page. page[before] returns the conversations just older than the given one
        (less recently active), page[after] the ones just more recent. Send at most
        one of them, once, with a cursor from this API: the `cursor` of a conversation,
        or the one in a Link header. A cursor is a position, so it stays right even
        if its conversation receives a message and moves to the top. page[size] (1
        to 100, default 100) says how many. The body holds only the conversations;
        more pages are announced in the Link header: rel="prev" (older conversations)
        on the most recent and before pages, rel="next" (more recent ones) on after
        pages, present only when there are more. The last page has no Link header.
        A page past the last conversation is an empty array.'
      parameters:
      - description: 'Customer account (letters, digits, . _ : -, up to 128 characters),
          sent once'
        in: query
        name: idYapeAccount
        required: true
        type: string
      - description: 'Cursor: read the page of conversations older than this position.
          Use the cursor of a conversation or the one in the Link header; it is opaque'
        in: query
        name: page[before]
        type: string
      - description: 'Cursor: read the page of conversations more recent than this
          position. Use the cursor of a conversation; it is opaque'
        in: query
        name: page[after]
        type: string
      - default: 100
        description: How many conversations the page holds, from 1 to 100 (default
          100); the Link header repeats it when it is not the default
        in: query
        maximum: 100
        minimum: 1
        name: page[size]
        type: integer
      produces:
      - application/json
      - application/problem+json
      responses:
        "200":
          description: OK
          headers:
            Link:
              description: 'Only when more conversations exist in the direction read:
                rel=prev (older) on most recent and before pages, rel=next (more recent)
                on after pages. The target is this route with idYapeAccount and page[before]
                or page[after] set to the cursor of the oldest or most recent conversation
                of the page, and page[size] repeated when it is not 100.'
              type: string
          schema:
            $ref: '#/definitions/handler.conversationsResponse'
        "400":
          description: 'Problem details (RFC 9457). Type invalid-request: account
            missing or malformed, both cursors, a parameter sent twice, a page[size]
            outside 1 to 100. Type invalid-cursor: empty or not a cursor this API
            issues for the conversation list'
          schema:
            $ref: '#/definitions/handler.problemResponse'
        "500":
          description: Problem details (RFC 9457), type about:blank
          schema:
            $ref: '#/definitions/handler.problemResponse'
      summary: List the conversations of an account
      tags:
      - Conversations
  /v1/conversations/{conversationId}/messages:
    get:
      description: 'Returns up to 100 chat messages, oldest first. Without a cursor
        it returns the newest page. page[before] returns the messages just older than
        the given message, page[after] the ones just newer. Send at most one of them,
        once, with a message _id of this conversation. page[size] (1 to 100, default
        100) says how many. The body holds only the conversation and its messages;
        more pages are announced in the Link header: rel="prev" (older messages) on
        the newest and before pages, rel="next" (newer messages) on after pages, present
        only when there are more. The last page has no Link header. A page past the
        last message is an empty array.'
      parameters:
      - description: 'Conversation id (letters, digits, . _ : -, up to 128 characters)'
        in: path
        name: conversationId
        required: true
        type: string
      - description: 'Customer account the conversation belongs to (letters, digits,
          . _ : -, up to 128 characters), sent once. A conversation of another account
          is not found'
        in: query
        name: idYapeAccount
        required: true
        type: string
      - description: 'Message _id: read the page of messages older than it'
        in: query
        name: page[before]
        type: string
      - description: 'Message _id: read the page of messages newer than it'
        in: query
        name: page[after]
        type: string
      - default: 100
        description: How many messages the page holds, from 1 to 100 (default 100);
          the Link header repeats it when it is not the default
        in: query
        maximum: 100
        minimum: 1
        name: page[size]
        type: integer
      produces:
      - application/json
      - application/problem+json
      responses:
        "200":
          description: OK
          headers:
            Link:
              description: 'Only when more messages exist in the direction read: rel=prev
                (older messages) on newest and before pages, rel=next (newer messages)
                on after pages. The target is this route with page[before] or page[after]
                set to the _id of the first or last message, and page[size] repeated
                when it is not 100.'
              type: string
          schema:
            $ref: '#/definitions/handler.messagesResponse'
        "400":
          description: 'Problem details (RFC 9457). Type invalid-request: malformed
            id, both cursors, a parameter sent twice, a page[size] outside 1 to 100.
            Type invalid-cursor: empty, not a plain decimal _id, or not a message
            of this conversation'
          schema:
            $ref: '#/definitions/handler.problemResponse'
        "404":
          description: 'Problem details (RFC 9457), type conversation-not-found: the
            conversation has no chat messages'
          schema:
            $ref: '#/definitions/handler.problemResponse'
        "500":
          description: Problem details (RFC 9457), type about:blank
          schema:
            $ref: '#/definitions/handler.problemResponse'
      summary: List the messages of a conversation
      tags:
      - Messages
schemes:
- http
swagger: "2.0"
