server:
  port: ${SERVER_PORT:-3100}

# The MCP server (cmd/mcp): tools over the history for an agent. Like the API, it has no
# authentication, so it must not be deployed.
mcp:
  # Loopback by default: there is no authentication, so the server is not offered to the network.
  host: ${MCP_HOST:-127.0.0.1}
  port: ${MCP_PORT:-3200}

# Same layout as ms-ml-genai-agents-bs, so a DSN or the discrete fields work alike.
postgres:
  # Full connection string. When set it wins over the discrete fields below.
  dsn: ${POSTGRES_DSN:-}
  host: ${POSTGRES_HOST:-localhost}
  port: ${POSTGRES_PORT:-5432}
  user: ${POSTGRES_USER:-postgres}
  password: ${POSTGRES_PASSWORD:-}
  database: ${POSTGRES_DB:-postgres}
  ssl_mode: ${POSTGRES_SSL_MODE:-disable}
  # The schema the tables are in: history, which the Camel consumers fill (camel_history is the old consumer's).
  # Set it empty to keep the database user's own search_path.
  search_path: ${POSTGRES_SEARCH_PATH:-history}
  max_conns: ${POSTGRES_MAX_CONNS:-10}
  min_conns: ${POSTGRES_MIN_CONNS:-2}
  conn_max_lifetime_seconds: ${POSTGRES_CONN_MAX_LIFETIME:-3600}
  conn_max_idle_time_seconds: ${POSTGRES_CONN_MAX_IDLE_TIME:-300}
  connect_timeout_seconds: ${POSTGRES_CONNECT_TIMEOUT:-10}

logging:
  level: ${LOG_LEVEL:-info}
